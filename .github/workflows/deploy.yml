
name: Update family tree


on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: family-tree-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate family tree data
        env:
          SHEETS_CSV_URL: ${{ vars.SHEETS_CSV_URL }}
        run: python build.py

      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/people.json _site/data/people.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        uses: actions/deploy-pages@v4
