<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Монгол угийн бичиг</title>
<style>
:root{color-scheme:light;--ink:#17332d;--green:#286e56;--muted:#64736e;--line:#8b9791}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial,sans-serif;color:var(--ink);background:#f4f7f5}
header{background:white;border-bottom:1px solid #dce6df;padding:13px 20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
h1{font-size:21px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap}input,button{border:1px solid #cad8cf;border-radius:9px;padding:9px 11px;background:white;font:inherit}input{width:240px;max-width:65vw}button{cursor:pointer}button:hover{background:#edf5ef}
main{display:grid;grid-template-columns:minmax(0,1fr) 285px;min-height:calc(100vh - 78px)}
#viewport{min-height:70vh;position:relative;overflow:hidden;touch-action:none;background:#fff}svg{display:block;width:100%;height:calc(100vh - 85px);min-height:540px;cursor:grab}svg.panning{cursor:grabbing}
svg .person{cursor:pointer}svg .person:hover .symbol{stroke:#d48b20;stroke-width:3}svg .symbol{fill:#d8eaff;stroke:#5488b5;stroke-width:1.7}svg .woman .symbol{fill:#fbe0ed;stroke:#b35d8c}svg .unknown .symbol{fill:#e5e9e7;stroke:#777}svg text{font:12px system-ui,Arial,sans-serif;fill:#24463c;text-anchor:middle;pointer-events:none}svg .years{font-size:10px;fill:#667670}svg .relation{stroke:#5b7068;stroke-width:1.6;fill:none}svg .marriage{stroke:#2f5046;stroke-width:2.2;fill:none}svg .focused .symbol{stroke:#dd8a16;stroke-width:4}svg .related .symbol{stroke:#2c8764;stroke-width:2.7}
svg .faded{opacity:.10}svg .focused,svg .related{opacity:1}
aside{background:#f9fbfa;border-left:1px solid #e0e9e3;padding:19px;overflow:auto}aside h2{font-size:17px;margin:0 0 12px}aside p{overflow-wrap:anywhere;line-height:1.6}aside dl{display:grid;grid-template-columns:110px 1fr;gap:9px 5px;font-size:13px}aside dt{color:var(--muted)}aside dd{margin:0;overflow-wrap:anywhere}#notice{color:#8e4824;font-size:13px}#legend{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:11px;height:11px;border:1.5px solid #5488b5;background:#d8eaff;margin:0 4px}.round{border-radius:100%;background:#fbe0ed;border-color:#b35d8c}
@media(max-width:800px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #ddd}svg{height:68vh;min-height:400px}}
</style>
</head>
<body>
<header><div><h1>🌳 Монгол угийн бичиг</h1><p>Хосууд нэг эгнээнд · Хүүхдүүд доор · Хүн дээр дарж ойрын хамаарлыг тодруулна</p></div>
<div class="controls"><input id="search" type="search" placeholder="Нэрээр хайх…" aria-label="Нэрээр хайх"><button id="reset">Бүгд</button><button id="zoom-in">＋</button><button id="zoom-out">－</button><button id="fit">Багтаах</button></div></header>
<main><div id="viewport"><svg id="chart" role="img" aria-label="Угийн мод" xmlns="http://www.w3.org/2000/svg"><g id="scene"></g></svg></div>
<aside><h2>Хүний мэдээлэл</h2><p id="legend"><span class="dot"></span> Эрэгтэй &nbsp; <span class="dot round"></span> Эмэгтэй</p><p id="notice">Хүн дээр дарахад эцэг эх, хань, хүүхдүүд тодорно.</p><div id="details"></div></aside></main>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('chart'),scene=document.getElementById('scene'),details=document.getElementById('details'),notice=document.getElementById('notice');
let people=[],byId=new Map(),edges=[],visuals=[],center=null,view={x:0,y:0,w:1000,h:700},bounds={w:1000,h:700};
const str=v=>String(v??'').trim();
const elem=(tag,attrs={},parent=scene)=>{const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e};
const kidOf=(person,id)=>str(person.father_id)===id||str(person.mother_id)===id;
function partners(id){const set=new Set();for(const p of people){const s=[p.spouse_id,p.spouse_id_2].map(str);if(p.id===id)s.forEach(q=>{if(byId.has(q)&&q!==id)set.add(q)});if(s.includes(id)&&p.id!==id)set.add(p.id)}for(const c of people){if(c.father_id===id&&byId.has(c.mother_id))set.add(c.mother_id);if(c.mother_id===id&&byId.has(c.father_id))set.add(c.father_id)}return [...set]}
function generations(){const gen=new Map(people.map(p=>[p.id,0]));for(let i=0;i<people.length+2;i++){let changed=false;for(const p of people){const parents=[p.father_id,p.mother_id].filter(id=>byId.has(id));if(parents.length){const needed=1+Math.max(...parents.map(id=>gen.get(id)));if(needed>gen.get(p.id)){gen.set(p.id,Math.min(needed,people.length));changed=true}}}if(!changed)break}
// Хосуудыг нэг эгнээнд оруулахын тулд гэр бүлийн түвшнийг дээш татна.
for(let i=0;i<people.length;i++){let changed=false;for(const p of people)for(const s of partners(p.id)){const v=Math.max(gen.get(p.id),gen.get(s));if(gen.get(p.id)!==v){gen.set(p.id,v);changed=true}if(gen.get(s)!==v){gen.set(s,v);changed=true}}if(!changed)break}
// Өгөгдөл буруу эсвэл давхар мөчлөгтэй байвал түвшинг хэт өсгөхөөс сэргийлнэ.
for(const id of gen.keys())gen.set(id,Math.min(gen.get(id),Math.max(0,people.length-1)));
return gen}
function layout(){const gen=generations(),levels=new Map();for(const p of people){const n=gen.get(p.id);if(!levels.has(n))levels.set(n,[]);levels.get(n).push(p)}
const pos=new Map();let maxWidth=650;const sorted=[...levels.keys()].sort((a,b)=>a-b);
for(const [li,level] of sorted.entries()){
const group=levels.get(level),seen=new Set(),units=[];
// Хосыг нэг блок болгох; олон ханьтай үед давхар дүрслэхийн оронд тэр хүнийг нэг л удаа зурна.
const ordered=[...group].sort((a,b)=>{const parentX=p=>{const ps=[p.father_id,p.mother_id].filter(id=>pos.has(id));return ps.length?ps.reduce((sum,id)=>sum+pos.get(id).x,0)/ps.length:999999};return parentX(a)-parentX(b)||a.id.localeCompare(b.id,'mn')});
for(const p of ordered){if(seen.has(p.id))continue;const mates=partners(p.id).filter(id=>gen.get(id)===level&&!seen.has(id));const members=[p,...mates.map(id=>byId.get(id))];members.forEach(q=>seen.add(q.id));const pp=members.flatMap(q=>[q.father_id,q.mother_id].filter(id=>pos.has(id)).map(id=>pos.get(id).x));const priority=pp.length?pp.reduce((a,b)=>a+b,0)/pp.length:1e8;units.push({members,priority})}
units.sort((a,b)=>a.priority-b.priority);
const gap=43,personStep=142,unitGap=77;
let x=90;for(const u of units){for(const p of u.members){pos.set(p.id,{x:x+35,y:65+li*180,p});x+=personStep}x+=unitGap}maxWidth=Math.max(maxWidth,x+40)
}
const maxY=75+sorted.length*180;for(const p of people){if(!pos.has(p.id))pos.set(p.id,{x:80,y:65,p})}
return {pos,w:maxWidth,h:Math.max(410,maxY)}
}
function draw(){scene.replaceChildren();visuals=[];edges=[];if(!people.length)return;
const {pos,w,h}=layout();bounds={w,h};const linkGroup=elem('g',{'aria-hidden':'true'}),peopleGroup=elem('g');
const family=new Map();for(const child of people){const f=byId.has(child.father_id)?child.father_id:'',m=byId.has(child.mother_id)?child.mother_id:'';if(!f&&!m)continue;const key=[f,m].join('|');if(!family.has(key))family.set(key,{f,m,kids:[]});family.get(key).kids.push(child.id)}
// Horizontal marriage lines: each couple shares one level and has children through the midpoint.
const couples=new Map();const coupleKey=(a,b)=>[a,b].sort().join('|');for(const p of people)for(const s of partners(p.id))if(pos.has(s))couples.set(coupleKey(p.id,s),[p.id,s]);
for(const [key,ids] of couples){const a=pos.get(ids[0]),b=pos.get(ids[1]);const y=Math.max(a.y,b.y)+17;const path=elem('path',{d:`M ${a.x} ${y} H ${b.x}`,class:'marriage'},linkGroup);edges.push({el:path,ids:new Set(ids),kind:'marriage'});}
for(const fa of family.values()){
const parents=[fa.f,fa.m].filter(Boolean);const pp=parents.map(id=>pos.get(id));const xp=pp.reduce((s,p)=>s+p.x,0)/pp.length;const originY=Math.max(...pp.map(p=>p.y))+18;
const kids=fa.kids.map(id=>pos.get(id)).filter(Boolean);if(!kids.length)continue;const branchY=Math.min(...kids.map(p=>p.y))-42;
let d=`M ${xp} ${originY} V ${branchY}`;if(kids.length>1)d+=` M ${Math.min(...kids.map(p=>p.x))} ${branchY} H ${Math.max(...kids.map(p=>p.x))}`;for(const p of kids)d+=` M ${p.x} ${branchY} V ${p.y-19}`;
const path=elem('path',{d,class:'relation'},linkGroup);edges.push({el:path,ids:new Set([...parents,...fa.kids]),kind:'family'});
}
for(const p of people){const at=pos.get(p.id),g=elem('g',{class:'person '+(p.gender.toLowerCase().includes('эмэгтэй')?'woman':p.gender.toLowerCase().includes('эрэгтэй')?'man':'unknown'),transform:`translate(${at.x},${at.y})`,tabindex:'0',role:'button','aria-label':p.name},peopleGroup);elem(p.gender.toLowerCase().includes('эмэгтэй')?'circle':'rect',p.gender.toLowerCase().includes('эмэгтэй')?{cx:0,cy:0,r:17,class:'symbol'}:{x:-17,y:-17,width:34,height:34,rx:2,class:'symbol'},g);const text=elem('text',{x:0,y:32},g);text.textContent=p.name.length>22?p.name.slice(0,21)+'…':p.name;const yr=elem('text',{x:0,y:45,class:'years'},g);yr.textContent=p.birth_year||'';g.addEventListener('click',e=>{e.stopPropagation();select(p.id)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p.id)}});visuals.push({id:p.id,el:g});}
fit();}
function setView(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}
function fit(){const cw=svg.clientWidth||1000,ch=svg.clientHeight||600,aspect=cw/ch;const ww=bounds.w+130,hh=bounds.h+90;const w=Math.max(ww,hh*aspect);view={x:(bounds.w-w)/2,y:-50,w,h:w/aspect};setView()}
function zoom(scale){const nx=view.w*scale,ny=view.h*scale;view.x+=(view.w-nx)/2;view.y+=(view.h-ny)/2;view.w=nx;view.h=ny;setView()}
function select(id){center=id;const p=byId.get(id);if(!p)return;const focus=new Set([id,...partners(id),p.father_id,p.mother_id,...people.filter(c=>kidOf(c,id)).map(c=>c.id)].filter(s=>byId.has(s)));
for(const item of visuals){item.el.classList.toggle('faded',!focus.has(item.id));item.el.classList.toggle('focused',item.id===id);item.el.classList.toggle('related',focus.has(item.id)&&item.id!==id)}
for(const e of edges){const direct=e.kind==='marriage'?e.ids.has(id):[...e.ids].some(q=>q===id)&&[...e.ids].some(q=>focus.has(q));e.el.classList.toggle('faded',!direct)}
details.replaceChildren();const dl=document.createElement('dl');const rows=[['Нэр',p.name],['Хүйс',p.gender],['Төрсөн он',p.birth_year],['Нас барсан он',p.death_year],['Төрсөн нутаг',p.birth_place],['Ихэр',p.twin],['Гэрлэсэн',p.married],['Гэрлэлтийн тоо',p.marriage_count],['Эцэг',byId.get(p.father_id)?.name],['Эх',byId.get(p.mother_id)?.name],['Хань',partners(id).map(s=>byId.get(s)?.name).join(', ')],['Хүүхдүүд',people.filter(c=>kidOf(c,id)).map(c=>c.name).join(', ')],['Нэмэлт мэдээлэл',p.notes]];for(const [key,value] of rows)if(str(value)){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value;dl.append(dt,dd)}details.append(dl);notice.textContent='Шууд хамаарал тодорлоо. “Бүгд” товчоор буцаана.'}
function reset(){center=null;for(const v of visuals)v.el.classList.remove('faded','focused','related');for(const e of edges)e.el.classList.remove('faded');details.replaceChildren();notice.textContent='Хүн дээр дарахад эцэг эх, хань, хүүхдүүд тодорно.'}
document.getElementById('reset').onclick=()=>{document.getElementById('search').value='';reset()};document.getElementById('zoom-in').onclick=()=>zoom(.8);document.getElementById('zoom-out').onclick=()=>zoom(1.25);document.getElementById('fit').onclick=fit;
document.getElementById('search').oninput=e=>{const query=e.target.value.trim().toLocaleLowerCase('mn');if(!query){reset();return}const p=people.find(p=>p.name.toLocaleLowerCase('mn').includes(query));if(p)select(p.id)};
svg.addEventListener('click',e=>{if(e.target===svg||e.target===scene)reset()});svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)},{passive:false});
let drag=null;svg.addEventListener('pointerdown',e=>{if(e.target.closest('.person'))return;drag={x:e.clientX,y:e.clientY,viewX:view.x,viewY:view.y};svg.setPointerCapture(e.pointerId);svg.classList.add('panning')});svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();view.x=drag.viewX-(e.clientX-drag.x)*view.w/r.width;view.y=drag.viewY-(e.clientY-drag.y)*view.h/r.height;setView()});svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('panning')});
fetch('./data/people.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('people.json татаж чадсангүй ('+r.status+')');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('JSON массив биш байна.');people=data.map(p=>Object.fromEntries(Object.entries(p).map(([k,v])=>[k,str(v)])));byId=new Map(people.map(p=>[p.id,p]));draw();notice.textContent=`Нийт ${people.length} хүн. Хүн дээр дарж шууд хамаарлыг үзээрэй.`}).catch(err=>{notice.textContent='Алдаа: '+err.message+' — GitHub Actions болон data/people.json файлыг шалгаарай.';console.error(err)});
</script>
</body>
</html>
