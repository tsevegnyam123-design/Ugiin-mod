<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Угийн бичиг</title><style>
:root{font-family:system-ui,'Arial',sans-serif;color:#193b32;background:#f3f8f5}*{box-sizing:border-box}body{margin:0}header{background:#174a3d;color:white;padding:20px 4%;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{margin:0;font-size:1.5rem}header small{opacity:.8}main{padding:16px 3%}button,input{font:inherit;border:1px solid #b4c9be;border-radius:8px;padding:9px 12px}button{cursor:pointer;background:white}button:hover{background:#e0ece6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input{min-width:210px;flex:1;max-width:340px}.board{background:white;border:1px solid #d6e5dd;border-radius:14px;overflow:auto;height:min(73vh,850px);position:relative}.board svg{min-width:100%;display:block}.hint{color:#527166;font-size:.86rem;margin:9px 0}#panel{border-radius:12px;background:white;padding:16px;border:1px solid #d6e5dd;margin-top:12px;white-space:pre-wrap}#panel[hidden]{display:none}.error{color:#a22}.person{cursor:pointer}.person:focus rect,.person:focus circle{stroke:#e8a126;stroke-width:4}svg text{pointer-events:none}.edge{fill:none;stroke:#648477;stroke-width:1.7}.marriage{stroke:#a0788b;stroke-width:2}.muted{opacity:.58}#status{font-size:.86rem}
</style></head><body><header><div><h1>🌳 Монгол угийн бичиг</h1><small>□ Эрэгтэй · ○ Эмэгтэй · шугам: гэр бүлийн холбоо</small></div><span id="status">Уншиж байна…</span></header><main><div class="toolbar"><input id="search" placeholder="Нэрээр хайх" aria-label="Нэрээр хайх"><button id="plus">Томруулах +</button><button id="minus">Жижигрүүлэх −</button><button id="reset">Анхны хэмжээ</button><button id="reload">Шинэчлэх</button></div><div class="board" id="board"><svg id="tree" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Угийн мод"></svg></div><p class="hint">Хүний дүрс дээр дарж дэлгэрэнгүй мэдээллийг харна уу. Хуудас GitHub Actions-ийн хамгийн сүүлд нийтэлсэн мэдээллийг харуулна.</p><div id="panel" hidden></div></main><script>
'use strict';const $=id=>document.getElementById(id);let people=[],scale=1;const ns='http://www.w3.org/2000/svg';const S=(name,attrs={},parent=$('tree'))=>{const e=document.createElementNS(ns,name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));parent.append(e);return e};const text=(parent,x,y,value,attrs={})=>{const e=S('text',{x,y,'text-anchor':'middle','font-size':12,fill:'#244237',...attrs},parent);e.textContent=String(value);return e};const id=v=>String(v||'').trim();const short=s=>s.length>20?s.slice(0,19)+'…':s;
function render(){const svg=$('tree');svg.replaceChildren();if(!people.length){text(svg,180,70,'Бүртгэл алга');svg.setAttribute('viewBox','0 0 400 140');return}const known=new Map(people.map(p=>[p.id,p]));const memo=new Map(),visiting=new Set();function depth(p){if(memo.has(p.id))return memo.get(p.id);if(visiting.has(p.id))return 0;visiting.add(p.id);const parents=[p.father,p.mother].filter(x=>known.has(x)&&x!==p.id);const v=parents.length?Math.min(15,1+Math.max(...parents.map(x=>depth(known.get(x))))):0;visiting.delete(p.id);memo.set(p.id,v);return v}for(const p of people)depth(p);const byD=new Map();for(const p of people){const d=memo.get(p.id)||0;if(!byD.has(d))byD.set(d,[]);byD.get(d).push(p)}const sizes=[...byD.values()].map(a=>a.length),mx=Math.max(...sizes),maxD=Math.max(...byD.keys());const stepX=165,stepY=160,margin=100,positions=new Map();for(const [d,rows] of byD){rows.forEach((p,i)=>positions.set(p.id,{x:margin+(i+(mx-rows.length)/2)*stepX,y:margin+d*stepY}))}const width=Math.max(520,(mx+1)*stepX),height=Math.max(250,(maxD+1)*stepY+120);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('width',width*scale);svg.setAttribute('height',height*scale);
// Parent-child connections, one edge per known parent. Unknown/private IDs are not drawn.
for(const p of people){const child=positions.get(p.id);for(const parId of new Set([p.father,p.mother])){const par=positions.get(parId);if(!par||parId===p.id)continue;S('path',{d:`M ${par.x} ${par.y+22} V ${par.y+55} L ${child.x} ${child.y-48} V ${child.y-25}`,class:'edge'})}}
const pairs=new Set();for(const p of people){for(const spouseId of [p.spouse1,p.spouse2]){if(!positions.has(spouseId)||spouseId===p.id)continue;const key=[p.id,spouseId].sort().join('|');if(pairs.has(key))continue;pairs.add(key);const a=positions.get(p.id),b=positions.get(spouseId);if(Math.abs(a.y-b.y)<1){S('path',{d:`M ${a.x} ${a.y} L ${b.x} ${b.y}`,class:'marriage','stroke-dasharray':'5 5'})}}}
for(const p of people){const {x,y}=positions.get(p.id);const g=S('g',{class:'person',tabindex:0,role:'button','aria-label':p.name});const female=/эмэгтэй/i.test(p.gender);if(female)S('circle',{cx:x,cy:y,r:22,fill:'#f7dfeb',stroke:'#a84e7f','stroke-width':2},g);else S('rect',{x:x-22,y:y-22,width:44,height:44,rx:3,fill:'#d9ebfa',stroke:'#3d7bab','stroke-width':2},g);text(g,x,y+39,short(p.name),{'font-weight':600});if(p.birth)text(g,x,y+55,p.birth,{'font-size':11,fill:'#58736a'});const select=()=>{const keys=[['Нэр',p.name],['Хүйс',p.gender],['Төрсөн он',p.birth],['Нас барсан он',p.death],['Төрсөн нутаг',p.birthplace],['Ихэр мөн эсэх',p.twin],['Гэрлэсэн эсэх',p.married],['Гэрлэлтийн тоо',p.marriages],['Эцэг',known.get(p.father)?.name],['Эх',known.get(p.mother)?.name],['Хань 1',known.get(p.spouse1)?.name],['Хань 2',known.get(p.spouse2)?.name],['Нэмэлт мэдээлэл',p.notes]];const panel=$('panel');panel.replaceChildren();const heading=document.createElement('h2');heading.textContent=p.name;panel.append(heading);for(const [k,v] of keys){if(!v)continue;const line=document.createElement('p');const b=document.createElement('strong');b.textContent=k+': ';line.append(b,document.createTextNode(v));panel.append(line)}panel.hidden=false};g.addEventListener('click',select);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}})}const q=$('search').value.toLocaleLowerCase('mn');if(q){for(const el of svg.querySelectorAll('.person')){const match=el.getAttribute('aria-label').toLocaleLowerCase('mn').includes(q);el.classList.toggle('muted',!match)}}}
async function load(){const status=$('status');status.textContent='Өгөгдөл уншиж байна…';try{const resp=await fetch('./data/people.json?t='+Date.now(),{cache:'no-store'});if(!resp.ok)throw new Error('data/people.json файл олдсонгүй');const rows=await resp.json();if(!Array.isArray(rows))throw Error('Өгөгдлийн формат буруу');people=rows.map(p=>Object.fromEntries(Object.entries(p).map(([k,v])=>[k,id(v)])));status.textContent=people.length+' хүн';render()}catch(e){status.textContent='Алдаа: '+e.message;status.classList.add('error')}}$('search').addEventListener('input',render);$('plus').onclick=()=>{scale=Math.min(2.5,scale*1.2);render()};$('minus').onclick=()=>{scale=Math.max(.4,scale/1.2);render()};$('reset').onclick=()=>{scale=1;render()};$('reload').onclick=load;load();
</script></body></html>
